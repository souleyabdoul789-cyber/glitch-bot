<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLITCH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Space Grotesk', sans-serif;
    background:#050507;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  /* GRADIENTS DE FOND */
  .orb1{
    position:absolute;
    width:700px;height:700px;
    background:radial-gradient(circle at center, #7c3aed 0%, #3b82f6 30%, transparent 70%);
    top:-200px;left:-200px;
    filter:blur(80px);
    opacity:.6;
  }
  .orb2{
    position:absolute;
    width:600px;height:600px;
    background:radial-gradient(circle at center, #ec4899 0%, #f59e0b 40%, transparent 70%);
    bottom:-150px;right:-150px;
    filter:blur(90px);
    opacity:.5;
  }
  .orb3{
    position:absolute;
    width:500px;height:500px;
    background:radial-gradient(circle at center, #06ffa5 0%, transparent 70%);
    top:50%;left:50%;
    filter:blur(100px);
    opacity:.3;
  }

  .card{
    position:relative;
    z-index:10;
    width:90%;max-width:440px;
    background:linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
    backdrop-filter:blur(40px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:32px;
    padding:40px;
    box-shadow: 0 25px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .top{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;
  }
  .status{
    display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1);
    padding:6px 12px;border-radius:100px;
    font-size:11px;letter-spacing:1px;color:#aaa;
  }
  .dot{
    width:8px;height:8px;
    background:linear-gradient(135deg, #00ff88, #00ccff);
    border-radius:50%;box-shadow:0 0 10px #00ff88;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.3)}}

  h1{
    font-size:48px;font-weight:700;line-height:.9;
    background:linear-gradient(100deg, #fff 20%, #a5b4fc 60%, #f0abfc 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:12px;
  }
  .sub{
    color:rgba(255,255,255,.5);font-size:15px;line-height:1.5;margin-bottom:28px;
  }
  .stats{
    display:grid;grid-template-columns:1fr 1fr;
    gap:12px;margin-bottom:28px;
  }
  .stat{
    background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.06);
    padding:16px;border-radius:16px;
  }
  .stat b{display:block;font-size:22px;background:linear-gradient(90deg,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat span{font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase}

  .btn{
    display:block;text-align:center;
    background:linear-gradient(100deg, #7c3aed, #3b82f6, #06b6d4);
    padding:16px;border-radius:16px;
    color:white;text-decoration:none;font-weight:700;
    box-shadow:0 10px 30px rgba(124,58,237,.4);
    transition:.2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(124,58,237,.6)}
  
  .code{
    margin-top:20px;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.08);
    padding:14px 16px;border-radius:12px;
    font-family:monospace;font-size:12px;
    display:flex;justify-content:space-between;
    color:#888;
  }
  .code span{color:#7c3aed}
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="orb3"></div>

  <div class="card">
    <div class="top">
      <div class="status"><div class="dot"></div> LIVE</div>
      <div style="font-size:11px;color:#555">v2.1.0 • ZINDER</div>
    </div>

    <h1>GLITCH<br>BOT</h1>
    <p class="sub">Système anti-toxique actif.<br>Parse mode: HTML • Protection ON</p>

    <div class="stats">
      <div class="stat"><b>99.9%</b><span>Uptime</span></div>
      <div class="stat"><b>12ms</b><span>Ping</span></div>
    </div>

    <a class="btn" href="#">Ouvrir Telegram →</a>

    <div class="code">
      <div><span>></span> bot.send_message(parse_mode="HTML")</div>
      <div style="color:#00ff88">●</div>
    </div>
  </div>
</body>
</html>
